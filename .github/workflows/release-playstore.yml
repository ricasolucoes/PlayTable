name: Release & Google Play Store

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: true
        default: production
        type: choice
        options: [production, internal, beta]

permissions:
  contents: write

concurrency:
  group: playstore-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install publisher dependencies
        run: pip install google-api-python-client google-auth google-auth-httplib2
      - name: Validate release version
        id: version
        run: |
          source scripts/android_version.sh
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]]; then
            echo "::error::Tag and export_presets.cfg disagree"
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Install Godot headless system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libgl1
      - name: Install matching Godot engine and Android template
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .godot-version)"
          base="https://github.com/godotengine/godot/releases/download/$version"
          curl -fL --retry 3 "$base/Godot_v${version}_linux.x86_64.zip" -o /tmp/godot.zip
          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${version}_linux.x86_64"
          echo "GODOT_BIN=/tmp/godot-bin/Godot_v${version}_linux.x86_64" >> "$GITHUB_ENV"
          echo "/tmp/godot-bin" >> "$GITHUB_PATH"
          curl -fL --retry 3 "$base/Godot_v${version}_export_templates.tpz" -o /tmp/templates.tpz
          template_dir="$HOME/.local/share/godot/export_templates/${version/-/.}"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$template_dir" android/build
          cp -R /tmp/godot-templates/templates/. "$template_dir/"
          unzip -q "$template_dir/android_source.zip" -d android/build
          cp "$template_dir/version.txt" android/build/.build_version
          chmod +x android/build/gradlew
          echo y | sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' >/dev/null 2>&1 || true
      - name: Test GDScript and publisher before release
        run: |
          python3 -m unittest discover -s tests/python -v
          tests/run_gut.sh
      - name: Prepare signing and publishing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_KEY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          mkdir -p /tmp/keystores
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/keystores/upload.jks
          printf '%s' "$PLAY_KEY_JSON" > /tmp/keystores/play-service-account.json
          test -s /tmp/keystores/upload.jks
          test -s /tmp/keystores/play-service-account.json
      - name: Build and verify signed AAB
        env:
          KEYSTORE_PATH: /tmp/keystores/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./build_aab.sh
      - name: Publish release
        env:
          TRACK: ${{ github.event.inputs.track || 'production' }}
        run: |
          python3 scripts/play_store_publish.py \
            --package org.playtable.app \
            --aab build/android/PlayTable.aab \
            --track "$TRACK" \
            --release-name "${{ steps.version.outputs.name }}" \
            --metadata-dir fastlane/metadata/android \
            --key /tmp/keystores/play-service-account.json
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PlayTable ${{ steps.version.outputs.name }}
          files: build/android/PlayTable.aab
          generate_release_notes: true
      - name: Remove temporary credentials
        if: always()
        run: rm -rf /tmp/keystores
