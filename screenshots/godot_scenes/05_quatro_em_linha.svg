<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <style>
      .bg { fill: #1f1f1f; }
      .top-btn { fill: #2e333d; rx: 12px; }
      .top-btn-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; text-anchor: middle; font-weight: 500; }
      .top-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 32px; font-weight: bold; }
      .board-rect { fill: #1a66cc; rx: 16px; opacity: 0.9; }
      .status { fill: #ff4d4d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 32px; text-anchor: middle; font-weight: bold; }
      .slot { fill: #14171c; }
      .piece-red { fill: #e63946; stroke: #b31d28; stroke-width: 3; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
      .piece-yellow { fill: #ffbe0b; stroke: #c99300; stroke-width: 3; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
    </style>
  </defs>
  <rect width="720" height="1280" class="bg"/>
  
  <!-- Top Bar -->
  <g transform="translate(20, 40)">
    <rect width="100" height="50" class="top-btn"/>
    <text x="50" y="32" class="top-btn-text">Voltar</text>
    <text x="130" y="36" class="top-title">Quatro em Linha</text>
  </g>
  
  <!-- Connect 4 Board Visual (7 cols x 6 rows) -->
  <g transform="translate(110, 360)">
    <rect width="500" height="430" class="board-rect"/>
    
    <!-- Slots & Pieces -->
    <!-- Row 0 (bottom) -->
    <circle cx="50" cy="370" r="26" class="piece-red"/>
    <circle cx="116" cy="370" r="26" class="piece-yellow"/>
    <circle cx="182" cy="370" r="26" class="piece-red"/>
    <circle cx="248" cy="370" r="26" class="piece-yellow"/>
    <circle cx="314" cy="370" r="26" class="piece-red"/>
    <circle cx="380" cy="370" r="26" class="piece-yellow"/>
    <circle cx="446" cy="370" r="26" class="slot"/>
    
    <!-- Row 1 -->
    <circle cx="50" cy="305" r="26" class="slot"/>
    <circle cx="116" cy="305" r="26" class="piece-red"/>
    <circle cx="182" cy="305" r="26" class="piece-yellow"/>
    <circle cx="248" cy="305" r="26" class="piece-red"/>
    <circle cx="314" cy="305" r="26" class="piece-yellow"/>
    <circle cx="380" cy="305" r="26" class="slot"/>
    <circle cx="446" cy="305" r="26" class="slot"/>
    
    <!-- Row 2 -->
    <circle cx="50" cy="240" r="26" class="slot"/>
    <circle cx="116" cy="240" r="26" class="slot"/>
    <circle cx="182" cy="240" r="26" class="piece-red"/>
    <circle cx="248" cy="240" r="26" class="piece-red"/>
    <circle cx="314" cy="240" r="26" class="slot"/>
    <circle cx="380" cy="240" r="26" class="slot"/>
    <circle cx="446" cy="240" r="26" class="slot"/>
    
    <!-- Row 3 -->
    <circle cx="50" cy="175" r="26" class="slot"/>
    <circle cx="116" cy="175" r="26" class="slot"/>
    <circle cx="182" cy="175" r="26" class="slot"/>
    <circle cx="248" cy="175" r="26" class="piece-red"/>
    <circle cx="314" cy="175" r="26" class="slot"/>
    <circle cx="380" cy="175" r="26" class="slot"/>
    <circle cx="446" cy="175" r="26" class="slot"/>
    
    <!-- Row 4 -->
    <circle cx="50" cy="110" r="26" class="slot"/>
    <circle cx="116" cy="110" r="26" class="slot"/>
    <circle cx="182" cy="110" r="26" class="slot"/>
    <circle cx="248" cy="110" r="26" class="slot"/>
    <circle cx="314" cy="110" r="26" class="slot"/>
    <circle cx="380" cy="110" r="26" class="slot"/>
    <circle cx="446" cy="110" r="26" class="slot"/>
    
    <!-- Row 5 (top) -->
    <circle cx="50" cy="45" r="26" class="slot"/>
    <circle cx="116" cy="45" r="26" class="slot"/>
    <circle cx="182" cy="45" r="26" class="slot"/>
    <circle cx="248" cy="45" r="26" class="slot"/>
    <circle cx="314" cy="45" r="26" class="slot"/>
    <circle cx="380" cy="45" r="26" class="slot"/>
    <circle cx="446" cy="45" r="26" class="slot"/>
  </g>
  
  <!-- Status Label -->
  <text x="360" y="860" class="status">Sua Vez! (Vermelho)</text>
</svg>