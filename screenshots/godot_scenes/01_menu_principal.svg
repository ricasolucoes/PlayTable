<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <style>
      .bg { fill: #14171c; }
      .title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 56px; font-weight: bold; text-anchor: middle; }
      .subtitle { fill: #99a6b3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 28px; text-anchor: middle; }
      .btn-bg { fill: #2e333d; rx: 16px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
      .btn-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 36px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>
  <rect width="720" height="1280" class="bg"/>
  
  <!-- Title & Subtitle -->
  <text x="360" y="160" class="title">Jogos de Mesa</text>
  <text x="360" y="220" class="subtitle">Offline Collection</text>
  
  <!-- Center Buttons VBoxContainer -->
  <!-- BtnTabuleiro -->
  <g transform="translate(200, 480)">
    <rect width="320" height="100" class="btn-bg"/>
    <text x="160" y="62" class="btn-text">Tabuleiro</text>
  </g>
  
  <!-- BtnCartas -->
  <g transform="translate(200, 604)">
    <rect width="320" height="100" class="btn-bg"/>
    <text x="160" y="62" class="btn-text">Cartas</text>
  </g>
  
  <!-- BtnConfig -->
  <g transform="translate(200, 728)">
    <rect width="320" height="100" class="btn-bg"/>
    <text x="160" y="62" class="btn-text">Configurações</text>
  </g>
</svg>