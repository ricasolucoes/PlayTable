<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <style>
      .bg { fill: #1a1a26; }
      .top-btn { fill: #2e333d; rx: 12px; }
      .top-btn-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; text-anchor: middle; font-weight: 500; }
      .title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 48px; font-weight: bold; text-anchor: middle; }
      .subtitle { fill: #8892b0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 30px; text-anchor: middle; }
      .box { fill: #232733; rx: 20px; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4)); }
    </style>
  </defs>
  <rect width="720" height="1280" class="bg"/>
  
  <!-- Top Bar -->
  <g transform="translate(20, 40)">
    <rect width="100" height="50" class="top-btn"/>
    <text x="50" y="32" class="top-btn-text">Voltar</text>
  </g>
  
  <!-- Center Box -->
  <g transform="translate(100, 480)">
    <rect width="520" height="280" class="box"/>
    <text x="260" y="110" class="title">Reversi</text>
    <text x="260" y="180" class="subtitle">(Vencedor Definido Pela</text>
    <text x="260" y="220" class="subtitle">Simulação!)</text>
  </g>
</svg>