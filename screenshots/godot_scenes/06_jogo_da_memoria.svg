<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <style>
      .bg { fill: #1a6633; }
      .top-btn { fill: #2e333d; rx: 12px; }
      .top-btn-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; text-anchor: middle; font-weight: 500; }
      .top-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 32px; font-weight: bold; }
      .status { fill: #e6f5ea; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 28px; text-anchor: middle; font-weight: 600; }
      .card-back { fill: #2e333d; rx: 12px; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3)); }
      .card-front { fill: #f0f4f8; rx: 12px; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3)); }
      .card-q { fill: #a0aec0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 48px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
      .card-val { fill: #2b6cb0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 48px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <rect width="720" height="1280" class="bg"/>
  
  <!-- Top Bar -->
  <g transform="translate(20, 40)">
    <rect width="100" height="50" class="top-btn"/>
    <text x="50" y="32" class="top-btn-text">Voltar</text>
    <text x="130" y="36" class="top-title">Jogo da Memória</text>
  </g>
  
  <!-- Status -->
  <text x="360" y="160" class="status">Encontre os Pares! | Pares: 2/8</text>
  
  <!-- 4x4 Grid centered -->
  <g transform="translate(180, 260)">
    <!-- Row 0 -->
    <rect x="0" y="0" width="80" height="120" class="card-back"/>
    <text x="40" y="65" class="card-q">?</text>
    
    <rect x="95" y="0" width="80" height="120" class="card-front"/>
    <text x="135" y="65" class="card-val">A</text>
    
    <rect x="190" y="0" width="80" height="120" class="card-back"/>
    <text x="230" y="65" class="card-q">?</text>
    
    <rect x="285" y="0" width="80" height="120" class="card-back"/>
    <text x="325" y="65" class="card-q">?</text>
    
    <!-- Row 1 -->
    <rect x="0" y="135" width="80" height="120" class="card-back"/>
    <text x="40" y="200" class="card-q">?</text>
    
    <rect x="95" y="135" width="80" height="120" class="card-back"/>
    <text x="135" y="200" class="card-q">?</text>
    
    <rect x="190" y="135" width="80" height="120" class="card-front"/>
    <text x="230" y="200" class="card-val">B</text>
    
    <rect x="285" y="135" width="80" height="120" class="card-back"/>
    <text x="325" y="200" class="card-q">?</text>
    
    <!-- Row 2 -->
    <rect x="0" y="270" width="80" height="120" class="card-front"/>
    <text x="40" y="335" class="card-val">A</text>
    
    <rect x="95" y="270" width="80" height="120" class="card-back"/>
    <text x="135" y="335" class="card-q">?</text>
    
    <rect x="190" y="270" width="80" height="120" class="card-back"/>
    <text x="230" y="335" class="card-q">?</text>
    
    <rect x="285" y="270" width="80" height="120" class="card-front"/>
    <text x="325" y="335" class="card-val">B</text>
    
    <!-- Row 3 -->
    <rect x="0" y="405" width="80" height="120" class="card-back"/>
    <text x="40" y="470" class="card-q">?</text>
    
    <rect x="95" y="405" width="80" height="120" class="card-back"/>
    <text x="135" y="470" class="card-q">?</text>
    
    <rect x="190" y="405" width="80" height="120" class="card-back"/>
    <text x="230" y="470" class="card-q">?</text>
    
    <rect x="285" y="405" width="80" height="120" class="card-back"/>
    <text x="325" y="470" class="card-q">?</text>
  </g>
</svg>