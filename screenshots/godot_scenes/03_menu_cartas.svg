<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <style>
      .bg { fill: #14171c; }
      .top-btn { fill: #2e333d; rx: 12px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
      .top-btn-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; text-anchor: middle; font-weight: 500; }
      .top-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 36px; font-weight: bold; }
      .card-bg { fill: #2e333d; rx: 16px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25)); }
      .card-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 28px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>
  <rect width="720" height="1280" class="bg"/>
  
  <!-- Top Bar -->
  <g transform="translate(30, 40)">
    <rect width="120" height="60" class="top-btn"/>
    <text x="60" y="38" class="top-btn-text">Voltar</text>
    <text x="160" y="44" class="top-title">Jogos de Cartas</text>
  </g>
  
  <!-- GridContainer (2 Columns) -->
  <!-- Col 1, Row 1: Memória -->
  <g transform="translate(30, 150)">
    <rect width="315" height="160" class="card-bg"/>
    <text x="157" y="92" class="card-text">Memória</text>
  </g>
  
  <!-- Col 2, Row 1: Solitário -->
  <g transform="translate(375, 150)">
    <rect width="315" height="160" class="card-bg"/>
    <text x="157" y="92" class="card-text">Solitário</text>
  </g>
  
  <!-- Col 1, Row 2: 21 (Blackjack) -->
  <g transform="translate(30, 335)">
    <rect width="315" height="160" class="card-bg"/>
    <text x="157" y="75" class="card-text">21</text>
    <text x="157" y="110" class="card-text">(Blackjack)</text>
  </g>
</svg>